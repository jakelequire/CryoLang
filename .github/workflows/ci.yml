name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: make cryo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 and clang++-20
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y llvm-20-dev clang-20 build-essential

      - name: Build cryo (bootstrap + stdlib + stage-2 + stage-3)
        run: make cryo

      - name: Smoke-test the binary
        run: |
          ./compiler/build/bin/cryo --version
          ./compiler/build/bin/cryo --help

      - name: Run the test suite (tests/ via cryo test)
        run: make test

  selfhost-check:
    name: selfhost-check (stage-4 == stage-5 byte-identity)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 and clang++-20
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y llvm-20-dev clang-20 build-essential

      - name: Run selfhost-check
        run: make selfhost-check

      - name: Upload stage logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-check-logs
          path: build-logs/
          if-no-files-found: ignore
