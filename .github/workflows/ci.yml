name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Run CI on a branch without opening a PR first. Without this the workflow
  # only ever fires against `main`, so a long-lived branch reaches the merge
  # with no CI result at all.
  workflow_dispatch:

# Cancel superseded PR runs: a new push to a PR aborts its in-flight CI rather
# than running redundant 20-40 min jobs to completion. Push runs on `main` are
# NOT cancelled, so every commit on the protected default branch gets a
# complete, conclusive CI result (never an aborted/inconclusive one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: make cryo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env', 'scripts/ci/install-llvm.sh') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      - name: Verify the committed pins match their sidecars (sha256)
        run: make verify-pin

      - name: Build cryo (stdlib + self-hosted compiler via pinned bin/cryo)
        run: make cryo

      - name: Smoke-test the binary
        run: |
          ./compiler/build/cryo --version
          ./compiler/build/cryo --help

      - name: Run the test suite (tests/ via cryo test)
        run: make test

      - name: Run the test suite at -O0 (catch opt-level-dependent miscompiles)
        run: make test ARGS="--opt-level=0"

      - name: Assert the discovered test roster matches the committed golden
        run: make roster-check

      # docs/name-resolution.md §7.2 mechanism 3. The resolution cascade grew
      # for years because nobody could see it growing; this makes a regrown
      # fuzzy fallback fail the build instead of waiting for the next
      # hand-taken snapshot. Ratchet, not `== 0` -- see scripts/b1-gate.py.
      - name: Assert the B1 fuzzy-fallback bucket matches its golden
        run: make b1-check

      # docs/name-resolution.md §7.2 mechanism 5. Privatizing the per-kind
      # lookups cannot stop a NEW public wrapper being added beside them, and
      # deleting one cannot stop a helper being reintroduced under another
      # name; only a ratchet catches that. Source-derived, so it needs no
      # build artifacts of its own.
      - name: Assert the resolution-lane surface matches its golden
        run: make lane-check

      # The importer binds a C constant and the serializer writes it; when the
      # two disagree on an AST shape the constant disappears with the generator
      # still reporting success, and the only symptom is `cannot find value` at
      # a use site one build later. The raylib acceptance project cannot cover
      # this (it needs raylib installed and a display, so it skips on CI); this
      # fixture needs neither.
      - name: Assert every constant shape survives cryo vendor generation
        run: make vendor-check

      - name: Build the example projects (examples/*/ smoke gate)
        run: make examples

      - name: Check example program output against goldens
        run: make examples-golden

      - name: Runtime memory-safety gate (examples under valgrind)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          make valgrind-check

      - name: Build the language server (tools/CryoLSP via bin/cryo)
        run: make lsp

      - name: Smoke-test the LSP binary
        run: |
          test -x bin/cryolsp || { echo "bin/cryolsp not built"; exit 1; }
          # cryolsp is a stdio JSON-RPC server (no --help). Smoke = it starts
          # and exits on its own when stdin closes, rather than hanging
          # (timeout -> 124) or dying on a signal (128+N).
          #
          # `|| code=$?` rather than `; code=$?`: the step runs under `bash -e`,
          # where a bare failing command aborts before the tolerance check below
          # can read its status - so an ordinary non-zero exit (cryolsp returns 1
          # on EOF) failed the step with no diagnostic at all.
          code=0
          printf '' | timeout 10 bin/cryolsp >/dev/null 2>&1 || code=$?
          if [ "$code" -ge 124 ]; then
            echo "cryolsp hung or crashed on EOF (exit $code)"; exit 1
          fi

  selfhost-check:
    name: selfhost-check (stage-3 == stage-4 byte-identity)
    runs-on: ubuntu-latest
    needs: build
    # Runs on PRs and pushes to main: a change that breaks the self-host
    # fixed point must fail the PR that introduces it, not surface only
    # after merge.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env', 'scripts/ci/install-llvm.sh') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      - name: Run selfhost-check
        run: make selfhost-check

      - name: Upload stage logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfhost-check-logs
          path: build-logs/
          if-no-files-found: ignore

  incremental-check:
    name: incremental-check (per-module rebuild == clean build)
    runs-on: ubuntu-latest
    needs: build
    # Per-module incremental compilation must be byte-identical to a clean
    # --no-incremental build for any edit; a false cache hit is a silent
    # miscompile. scripts/incremental-check.py runs the edit matrix that
    # guards this. Nothing else in CI exercises the incremental path (the
    # build/selfhost jobs force clean builds), so without this a caching
    # regression ships unnoticed.
    # The matrix drives ~7 clean compiler builds plus the stage-2 bootstrap, so
    # the ceiling is sized for that, not for a single build: the whole run
    # measures ~16 min on a fast multi-core host, which leaves no headroom at 30
    # on a 2-core runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env', 'scripts/ci/install-llvm.sh') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      - name: Run the incremental-build soundness matrix
        run: make incremental-check

  windows-smoke:
    name: windows smoke (cross-build + wine)
    runs-on: ubuntu-latest
    needs: build
    # Windows x86_64 is a shipped release target. The binary is cross-built on
    # Linux (mingw-w64 + a synthesized LLVM-C import lib) exactly as in
    # release.yml, then executed under wine so a Windows binary that fails to
    # load or start can never publish unvalidated. wine can run cryo.exe
    # because the official msvc LLVM-C.dll statically links the MSVC CRT and so
    # needs only kernel32/advapi32/ntdll (all wine builtins) - see
    # scripts/fetch-windows-llvm.sh.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env', 'scripts/ci/install-llvm.sh') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      - name: Install the mingw-w64 cross toolchain + wine
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip wine

      - name: Restore the windows LLVM bits cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/llvm-win
          key: llvm-win-${{ hashFiles('scripts/llvm-version.env') }}

      - name: Fetch the windows LLVM bits (LLVM-C.dll + mingw import lib)
        run: ./scripts/fetch-windows-llvm.sh

      - name: Cross-build the windows release zip
        run: ./scripts/build-release.sh windows

      - name: Smoke-test cryo.exe under wine
        env:
          WINEDEBUG: "-all"
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: |
          set -e
          out="$(mktemp -d)"
          unzip -q dist/cryo-*-windows-x86_64.zip -d "$out"
          exe="$(find "$out" -name cryo.exe | head -1)"
          if [ -z "$exe" ]; then echo "cryo.exe not found in the windows zip"; exit 1; fi
          # Current ubuntu images ship the 64-bit loader as `wine` and no longer
          # provide a `wine64` command; older ones only have `wine64`. Take
          # whichever exists so the job runs on either image.
          wine="$(command -v wine64 || command -v wine || true)"
          if [ -z "$wine" ]; then echo "no wine binary on PATH"; exit 1; fi
          # Run from the binary's own dir so it finds LLVM-C.dll beside it.
          cd "$(dirname "$exe")"
          "$wine" cryo.exe --version
          "$wine" cryo.exe --help

  windows-native:
    name: windows native (build + test on windows-latest)
    runs-on: windows-latest
    # Independent of the Linux `build` job (different host); runs in parallel.
    # NOTE (partially validated): this job was authored without a Windows runner
    # to test against and still needs iteration before it is made a required
    # check. Settled so far: the toolchain now comes from the runner's MSYS2
    # rather than chocolatey's mingw, because the test link needs a mingw-native
    # OpenSSL that chocolatey does not provide. Still unproven are (a) `cc`/`ar`
    # availability for the test-helpers recipe (Makefile:367-370) and (b) the
    # LLVM-C import-lib synthesis tool names passed to fetch-windows-llvm.sh.
    # The cross-build `windows-smoke` job above stays as the always-green
    # Windows gate until this one is proven.
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # GNU make (so the cmd-shell Windows recipes run) and LLVM (llvm-readobj,
      # used to dump LLVM-C.dll exports).  GNU make on native Windows drives
      # recipes through cmd.exe, which is what the HOST_OS==windows branch of
      # the Makefile expects (backslash paths, `rmdir /s /q`); running make from
      # bash would break those recipes, so this must stay the chocolatey build
      # rather than MSYS2's.
      #
      # mingw-w64 deliberately does NOT come from chocolatey here -- see the
      # MSYS2 step below.
      - name: Install GNU make and LLVM
        run: |
          choco install --no-progress -y make llvm

      # The test suite links system OpenSSL: tests/cryoconfig carries
      # `[link] system = ["ssl", "crypto"]` because net::tls binds it.
      # chocolatey's mingw ships no OpenSSL at all, and chocolatey's `openssl`
      # package is an MSVC build whose .lib import libraries mingw's ld cannot
      # consume -- so `gcc -lssl -lcrypto` fails with "cannot find -lssl".
      #
      # Take gcc AND OpenSSL from the runner's preinstalled MSYS2 instead, so
      # the compiler and the libraries it links come from one toolchain
      # (libssl.a / libcrypto.a built against the same runtime).  This mirrors
      # the working local dev setup, which is msys64 mingw64.
      - name: Install the MSYS2 mingw64 toolchain + OpenSSL
        shell: cmd
        run: |
          if not exist C:\msys64\usr\bin\pacman.exe (echo MSYS2 not found at C:\msys64 & exit /b 1)
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl

      # Prepend mingw64/bin so gcc, ar and dlltool all resolve to the MSYS2
      # toolchain that owns the OpenSSL archives.  Only mingw64/bin goes on
      # PATH -- adding msys64/usr/bin would put MSYS2's sh-driven `make` ahead
      # of the chocolatey one and break the cmd-shell recipes.
      - name: Put the MSYS2 mingw64 toolchain first on PATH
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The test-helpers archive recipe (Makefile:367-370) shells out to `cc`
      # and `ar`. mingw-w64 ships `gcc`/`ar` but not always `cc`; alias it.
      - name: Ensure a `cc` shim exists for the test-helper recipe
        run: |
          $gcc = (Get-Command gcc).Source
          $cc  = Join-Path (Split-Path $gcc) 'cc.exe'
          if (-not (Test-Path $cc)) { Copy-Item $gcc $cc }
          Write-Host "gcc resolved to: $gcc"
          gcc --version
          ar --version
          dlltool --version
          llvm-readobj --version

      # Prove `-lssl -lcrypto` resolves for THIS gcc before spending ~30
      # minutes on the build: the test link is the last step that would notice,
      # and it reports the failure as a wall of linker text with the real cause
      # ("cannot find -lssl") buried in it.
      - name: Verify OpenSSL is linkable by this toolchain
        run: |
          'int main(void){return 0;}' | Out-File -Encoding ascii ssl-probe.c
          gcc ssl-probe.c -lssl -lcrypto -o ssl-probe.exe
          if ($LASTEXITCODE -ne 0) {
            throw "gcc cannot link -lssl/-lcrypto; tests/cryoconfig requires system OpenSSL"
          }
          Remove-Item ssl-probe.c, ssl-probe.exe -Force
          Write-Host "OpenSSL links cleanly"

      - name: Restore the windows LLVM bits cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/llvm-win
          key: llvm-win-native-${{ hashFiles('scripts/llvm-version.env') }}

      # Synthesize the LLVM-C mingw import lib (lib/libLLVM-C.dll.a) and stage
      # the runtime DLL (bin/LLVM-C.dll). fetch-windows-llvm.sh is a bash script;
      # run it under Git Bash (present on the runner). It also downloads the
      # Part-2 llvm-mingw/wine driver, which a native build does not strictly
      # need; that overhead is acceptable and keeps us on the single shared
      # provisioning path. Override the Linux-style tool names with the
      # choco-installed unprefixed ones (llvm-readobj / dlltool).
      - name: Fetch / synthesize the windows LLVM-C import lib + DLL
        shell: bash
        env:
          LLVM_READOBJ: llvm-readobj
          DLLTOOL: dlltool
        run: ./scripts/fetch-windows-llvm.sh

      # cryo.exe (both the committed pin and the freshly built stage-2) loads
      # LLVM-C.dll at runtime; put its directory on PATH for every later step.
      - name: Put LLVM-C.dll on PATH
        run: |
          "$(Resolve-Path .toolchains/llvm-win/bin)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify the committed pins match their sidecars (sha256)
        run: make verify-pin

      - name: Build cryo (stdlib + self-hosted compiler via pinned bin/cryo.exe)
        env:
          CRYO_CC: gcc
        run: make cryo

      - name: Smoke-test the binary
        run: |
          ./compiler/build/cryo.exe --version
          ./compiler/build/cryo.exe --help

      - name: Run the test suite (tests/ via cryo test)
        env:
          CRYO_CC: gcc
        run: make test

      - name: Run the test suite at -O0 (catch opt-level-dependent miscompiles)
        env:
          CRYO_CC: gcc
        run: make test ARGS="--opt-level=0"
