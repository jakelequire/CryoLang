name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: make cryo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 and clang++-20
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y llvm-20-dev clang-20 build-essential

      - name: Build cryo (stdlib + self-hosted compiler via pinned bin/cryo)
        run: make cryo

      - name: Smoke-test the binary
        run: |
          ./compiler/build/bin/cryo --version
          ./compiler/build/bin/cryo --help

      - name: Run the test suite (tests/ via cryo test)
        run: make test

      - name: Build the language server (tools/CryoLSP via bin/cryo)
        run: make lsp

      - name: Smoke-test the LSP binary
        run: |
          test -x bin/cryolsp || (echo "bin/cryolsp not built" && exit 1)
          bin/cryolsp --help >/dev/null 2>&1 || true

  selfhost-check:
    name: selfhost-check (stage-3 == stage-4 byte-identity)
    runs-on: ubuntu-latest
    needs: build
    # Runs on PRs and pushes to main: a change that breaks the self-host
    # fixed point must fail the PR that introduces it, not surface only
    # after merge.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 and clang++-20
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y llvm-20-dev clang-20 build-essential

      - name: Run selfhost-check
        run: make selfhost-check

      - name: Upload stage logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-check-logs
          path: build-logs/
          if-no-files-found: ignore
