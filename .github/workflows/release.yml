name: Release

# Tag-triggered. Push a tag like `v1.0.0` (matching VERSION in
# compiler/src/main.cryo) to build + publish the distributable archives.
#
# Release-candidate tags (`v1.0.0-rc1`, `v1.0.0-rc.2`, ...) are supported as
# end-to-end dry runs: the base version must still match VERSION, and the
# GitHub Release is marked as a prerelease. Push one to exercise this whole
# workflow before pushing the real tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 - static `cryo` (--release-static).
  #
  # v1 ships a fully-static GLIBC binary (no libLLVM-20.so dependency): the
  # validated, low-risk path. It runs on any glibc Linux.
  #
  # FUTURE (fully-static MUSL, runs on Alpine too): switch this job to
  #   container: alpine:3.20
  # and `apk add llvm20-static llvm20-dev clang lld musl-dev g++ make
  # tar bash gcompat`, then build with the musl static-link knobs:
  #   CRYO_LLVM_CONFIG=llvm-config CRYO_CC=clang scripts/build-release.sh linux
  # The one fragile step is running the committed glibc bin/cryo under gcompat
  # to seed the build; if that proves flaky, keep this glibc-static job.
  # ---------------------------------------------------------------------------
  linux:
    name: linux x86_64 (static)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env', 'scripts/ci/install-llvm.sh') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      - name: Verify the committed pins are clean & reproducible (release gate)
        run: make verify-pin-clean

      # The static link takes LLVM's compression and XML libraries as
      # archives, which only their -dev packages ship.
      - name: Install the static link's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev zlib1g-dev libxml2-dev

      - name: Build static release tarball
        run: ./scripts/build-release.sh linux

      - name: Build the Debian package from the tarball
        run: ./scripts/build-deb.sh dist/cryo-*-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            dist/cryo-*-linux-x86_64.tar.gz
            dist/cryo-*-linux-x86_64.tar.gz.sha256
            dist/cryo_*_amd64.deb
            dist/cryo_*_amd64.deb.sha256

  # ---------------------------------------------------------------------------
  # Windows x86_64 - cross-built cryo.exe + bundled LLVM-C.dll (not static;
  # no official static windows-gnu libLLVM exists).
  # ---------------------------------------------------------------------------
  windows:
    name: windows x86_64 (cross)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env', 'scripts/ci/install-llvm.sh') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      # wine as well as the cross toolchain: build-release.sh now compiles and
      # RUNS a hello-world with the staged tree before it packages it, and a
      # cross-built cryo.exe cannot be run on this host any other way.  Without
      # it the build refuses rather than shipping an archive nothing exercised.
      - name: Install the mingw-w64 cross toolchain + wine
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip wine wixl msitools

      - name: Restore the windows LLVM bits cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/llvm-win
          key: llvm-win-${{ hashFiles('scripts/llvm-version.env') }}

      - name: Fetch the windows LLVM bits (LLVM-C.dll + mingw import lib)
        run: ./scripts/fetch-windows-llvm.sh

      - name: Verify the committed pins are clean & reproducible (release gate)
        run: make verify-pin-clean

      - name: Build windows release zip
        env:
          WINEDEBUG: "-all"
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: ./scripts/build-release.sh windows

      - name: Build the MSI from the zip, and its winget manifests
        run: |
          ./scripts/build-msi.sh dist/cryo-*-windows-x86_64.zip
          ./scripts/build-winget.sh dist/cryo-*-windows-x86_64.msi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            dist/cryo-*-windows-x86_64.zip
            dist/cryo-*-windows-x86_64.zip.sha256
            dist/cryo-*-windows-x86_64.msi
            dist/cryo-*-windows-x86_64.msi.sha256
            dist/winget/

  # ---------------------------------------------------------------------------
  # Verify - re-run the correctness suite on the tagged commit itself, so a tag
  # pushed to a commit that never went green on main (or a flaky/skipped CI run)
  # cannot publish a miscompiled binary.
  #
  # This said it mirrored the CI build job's gates and did not: it ran the
  # suite and the output goldens, where CI runs thirteen gates.  A tag can be
  # pushed to any commit and CI fires only on main or a manual dispatch, so for
  # a tag off main this job is the ONLY correctness gate standing in front of
  # `publish` - and it is the one place where a green turns into bytes other
  # people download.  It now carries the gates that say something about the
  # ARTIFACT: the roster, the suite with its counts asserted, the runtime the
  # archive actually ships, the language server it ships, and the examples.
  #
  # Deliberately NOT here:
  #   api-index-check        docs/stdlib-api.txt is not in the archive.
  # The exclusion is a decision rather than an oversight; reverse it if the
  # index starts shipping.
  # ---------------------------------------------------------------------------
  test:
    name: verify suite on the tagged commit
    runs-on: ubuntu-latest
    # Raised from 30 for the added gates: the suite runs twice, plus the
    # runtime and the examples.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env', 'scripts/ci/install-llvm.sh') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      - name: Verify the committed pins match their sidecars (sha256)
        run: make verify-pin

      - name: Build cryo (self-hosted compiler via pinned bin/cryo)
        run: make cryo

      # The roster first, then the suite with its counts asserted.  `make test`
      # passes on an exit code, and a suite that ran nothing exits 0 printing
      # OVERALL PASS - so on a tag it could publish a release over a corpus
      # that never executed.  Of every place in this repo to take a green on
      # faith, this is the worst one.
      - name: Assert the discovered test roster matches the committed golden
        run: make roster-check

      - name: Run the test suite (default -O2), with the suite counts asserted
        run: make test-census

      - name: Run the test suite at -O0, with the suite counts asserted
        run: make test-census ARGS="--opt-level=0"

      # The release archive SHIPS the runtime (build-release.sh stage_runtime),
      # whose hosted configurations every suite program above builds and links;
      # this is the gate for its freestanding one.  The windows arm needs wine,
      # which this runner has not got, so the skip is stated rather than hidden
      # in a zero.
      - name: Freestanding runtime acceptance (linux arm; windows needs wine)
        run: make verify-freestanding ARGS=--allow-skipped-arm

      - name: The language server builds with this compiler and passes its checks
        run: make lsp-check

      - name: Build the example projects (examples/*/ smoke gate)
        run: make examples

      - name: Check example program output against goldens
        run: make examples-golden

  # ---------------------------------------------------------------------------
  # Publish - verify both platforms' archives, then attach them to the GH
  # Release with a curated body (CHANGELOG section + platform matrix).
  # ---------------------------------------------------------------------------
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, test]
    permissions:
      contents: write   # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify the tag matches VERSION
        id: gate
        run: |
          VER=$(grep -oE 'const VERSION:[[:space:]]*string[[:space:]]*=[[:space:]]*"[^"]+"' \
                  compiler/src/main.cryo | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-rc*}"   # v1.0.0-rc1 -> 1.0.0; plain v1.0.0 unchanged
          echo "VERSION=$VER  tag=$TAG  base=$BASE"
          if [ "$VER" != "$BASE" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match VERSION '$VER' in compiler/src/main.cryo"
            exit 1
          fi
          # Version single-source-of-truth: the latest CHANGELOG header must
          # match VERSION, so a code bump that forgets the changelog can't ship.
          CHLOG=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | sed -E 's/.*\[([0-9.]+)\].*/\1/')
          echo "CHANGELOG latest=$CHLOG"
          if [ "$CHLOG" != "$VER" ]; then
            echo "::error::CHANGELOG latest version '[$CHLOG]' does not match VERSION '$VER' in compiler/src/main.cryo"
            exit 1
          fi
          if [ "$TAG" != "$BASE" ]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Never publish an archive we haven't verified: checksums must match,
      # the linux tarball must contain a runnable static cryo (this runner
      # has no LLVM installed, so `--version` succeeding also proves the
      # binary is self-contained), and the windows zip must have the
      # expected layout.
      - name: Verify artifact checksums and contents
        run: |
          cd dist
          sha256sum -c ./*.sha256

          mkdir -p /tmp/relcheck
          tar -xzf cryo-*-linux-x86_64.tar.gz -C /tmp/relcheck
          /tmp/relcheck/cryo-*/bin/cryo --version
          # A staging regression that dropped the stdlib or a metadata file
          # would otherwise only surface at user install time; assert the
          # expected layout here, mirroring the windows zip check below.
          for f in bin/cryo bin/cryolsp stdlib/lib.cryo stdlib/.bin/shipped runtime/lib.cryo \
                   runtime/.bin/shipped install-dependencies.sh VERSION LICENSE; do
            test -e /tmp/relcheck/cryo-*/"$f" \
              || { echo "::error::linux tarball is missing $f"; exit 1; }
          done

          unzip -q -d /tmp/relcheck-win cryo-*-windows-x86_64.zip
          for f in bin/cryo.exe bin/cryolsp.exe bin/LLVM-C.dll bin/libclang.dll stdlib/lib.cryo \
                   stdlib/.bin/shipped runtime/lib.cryo runtime/.bin/shipped install-dependencies.ps1 user-setup.ps1 VERSION; do
            test -e /tmp/relcheck-win/cryo-*/"$f" \
              || { echo "::error::windows zip is missing $f"; exit 1; }
          done

          # Each ships the stdlib archives of the default profiles (release
          # and --dev), built by the shipped compiler; without them every
          # installed compiler builds its own on first use.
          for tree in /tmp/relcheck/cryo-* /tmp/relcheck-win/cryo-*; do
            n="$(ls "$tree"/stdlib/.bin/*/prebuilt/*/stdlib.manifest 2>/dev/null | wc -l)"
            [ "$n" -eq 2 ] \
              || { echo "::error::$(basename "$tree") ships $n stdlib archives, expected 2"; exit 1; }
          done

          # The .deb holds the tarball's tree under /usr/lib/cryo, the
          # /usr/bin links, and depends on the C toolchain and nothing the
          # static binary does not need.
          deb="$(ls cryo_*_amd64.deb)"
          dpkg-deb -c "$deb" | grep -q ' ./usr/lib/cryo/bin/cryo$' || { echo "::error::$deb holds no /usr/lib/cryo/bin/cryo"; exit 1; }
          dpkg-deb -c "$deb" | grep -q ' ./usr/bin/cryo -> ../lib/cryo/bin/cryo$' || { echo "::error::$deb links no /usr/bin/cryo"; exit 1; }
          [ "$(dpkg-deb -f "$deb" Depends)" = "gcc, libc6-dev" ] || { echo "::error::$deb depends on: $(dpkg-deb -f "$deb" Depends)"; exit 1; }

          # The MSI holds exactly the zip's files, and runs the tree's
          # user-setup.ps1 to add the PATH entry and take it out again.
          sudo apt-get install -y msitools
          msiextract -C /tmp/relcheck-msi cryo-*-windows-x86_64.msi > /dev/null
          ( cd /tmp/relcheck-win/cryo-* && find . -type f | sort ) > /tmp/zip.files
          ( cd /tmp/relcheck-msi/.cryo && find . -type f | sort ) > /tmp/msi.files
          diff /tmp/zip.files /tmp/msi.files || { echo "::error::the MSI's files differ from the zip's"; exit 1; }
          for action in AddToPath RemoveFromPath DependencyStep; do
            msiinfo export cryo-*-windows-x86_64.msi CustomAction | grep -q "^${action}"$'\t' \
              || { echo "::error::the MSI has no ${action} action"; exit 1; }
          done
          # Removal runs the deferred RemoveFromPath inside the transaction
          # InstallInitialize opens and before RemoveFiles deletes its script;
          # an upgrade removes the older Cryo before InstallInitialize.
          sequence="$(msiinfo export cryo-*-windows-x86_64.msi InstallExecuteSequence)"
          at() { printf '%s\n' "$sequence" | awk -F'\t' -v action="$1" '$1 == action { sub(/\r$/, "", $3); print $3 }'; }
          [ "$(at InstallInitialize)" -lt "$(at RemoveFromPath)" ] && [ "$(at RemoveFromPath)" -lt "$(at RemoveFiles)" ] \
            || { echo "::error::the MSI runs RemoveFromPath at $(at RemoveFromPath), not between InstallInitialize and RemoveFiles"; exit 1; }
          [ "$(at RemoveExistingProducts)" -lt "$(at InstallInitialize)" ] \
            || { echo "::error::the MSI runs RemoveExistingProducts at $(at RemoveExistingProducts), after InstallInitialize"; exit 1; }
          test -f winget/manifests/c/CryoLang/Cryo/*/CryoLang.Cryo.installer.yaml \
            || { echo "::error::no winget installer manifest"; exit 1; }

      # Curated body: install one-liners + platform matrix, then the
      # CHANGELOG section for this version. The auto-generated "what's
      # changed" PR list is appended after it by gh-release.
      - name: Compose the release body
        run: |
          BASE="${{ steps.gate.outputs.base }}"
          {
            cat <<EOF
          ## Install

          **Linux x86_64**
          \`\`\`bash
          curl -fsSL https://cryolang.org/install.sh | bash
          \`\`\`

          **Windows x86_64** (PowerShell)
          \`\`\`powershell
          irm https://cryolang.org/install.ps1 | iex
          \`\`\`

          Or download an archive below and verify it with \`sha256sum -c <archive>.sha256\`.

          | Platform | Artifact | Notes |
          | --- | --- | --- |
          | Linux x86_64 (any glibc distro) | \`cryo-${BASE}-linux-x86_64.tar.gz\` | Fully static binary - no LLVM or other runtime dependencies. |
          | Debian / Ubuntu x86_64 | \`cryo_${BASE}-1_amd64.deb\` | \`sudo apt install ./cryo_${BASE}-1_amd64.deb\`; pulls in gcc and the C library headers. |
          | Windows 10+ x86_64 | \`cryo-${BASE}-windows-x86_64.zip\` | \`cryo.exe\` + bundled \`LLVM-C.dll\`; the installer offers llvm-mingw for the link. |
          | Windows 10+ x86_64 | \`cryo-${BASE}-windows-x86_64.msi\` | Per-user install into \`%USERPROFILE%\\.cryo\`, added to PATH. |

          Compiling your programs shells out to a system C compiler for the final link (\`gcc\`/\`clang\` on Linux, llvm-mingw or mingw-w64 \`gcc\` on Windows); a build that finds none stops with E0705 and names the install's \`install-dependencies\` step. The winget manifests for \`CryoLang.Cryo\` are attached for the winget package repository. macOS, ARM64 and musl/Alpine prebuilts are not part of v1 - build from source with \`./install.sh --dev\`.

          ## Changelog

          EOF
            awk -v ver="$BASE" '
              $0 ~ "^## \\[" ver "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
          } > /tmp/release-body.md
          echo "--- release body ---"
          cat /tmp/release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: /tmp/release-body.md
          prerelease: ${{ steps.gate.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/cryo-*-linux-x86_64.tar.gz
            dist/cryo-*-linux-x86_64.tar.gz.sha256
            dist/cryo-*-windows-x86_64.zip
            dist/cryo-*-windows-x86_64.zip.sha256
            dist/cryo_*_amd64.deb
            dist/cryo_*_amd64.deb.sha256
            dist/cryo-*-windows-x86_64.msi
            dist/cryo-*-windows-x86_64.msi.sha256
            dist/winget/manifests/c/CryoLang/Cryo/*/*.yaml
