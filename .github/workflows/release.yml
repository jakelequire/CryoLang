name: Release

# Tag-triggered. Push a tag like `v1.0.0` (matching VERSION in
# compiler/src/main.cryo) to build + publish the distributable archives.
#
# Release-candidate tags (`v1.0.0-rc1`, `v1.0.0-rc.2`, ...) are supported as
# end-to-end dry runs: the base version must still match VERSION, and the
# GitHub Release is marked as a prerelease. Push one to exercise this whole
# workflow before pushing the real tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 — static `cryo` (--release-static).
  #
  # v1 ships a fully-static GLIBC binary (no libLLVM-20.so dependency): the
  # validated, low-risk path. It runs on any glibc Linux.
  #
  # FUTURE (fully-static MUSL, runs on Alpine too): switch this job to
  #   container: alpine:3.20
  # and `apk add llvm20-static llvm20-dev clang lld musl-dev g++ make
  # python3 tar bash gcompat`, then build with the musl static-link knobs:
  #   CRYO_LLVM_CONFIG=llvm-config CRYO_CC=clang scripts/build-release.sh linux
  # The one fragile step is running the committed glibc bin/cryo under gcompat
  # to seed the build; if that proves flaky, keep this glibc-static job.
  # ---------------------------------------------------------------------------
  linux:
    name: linux x86_64 (static)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      - name: Build static release tarball
        run: ./scripts/build-release.sh linux

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            dist/cryo-*-linux-x86_64.tar.gz
            dist/cryo-*-linux-x86_64.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # Windows x86_64 — cross-built cryo.exe + bundled LLVM-C.dll (not static;
  # no official static windows-gnu libLLVM exists).
  # ---------------------------------------------------------------------------
  windows:
    name: windows x86_64 (cross)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore the LLVM toolchain cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cryo-ci
          key: llvm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/llvm-version.env') }}

      - name: Install the LLVM toolchain (apt.llvm.org on cache miss)
        run: ./scripts/ci/install-llvm.sh

      - name: Install the mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip

      - name: Restore the windows LLVM bits cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .toolchains/llvm-win
          key: llvm-win-${{ hashFiles('scripts/llvm-version.env') }}

      - name: Fetch the windows LLVM bits (LLVM-C.dll + mingw import lib)
        run: ./scripts/fetch-windows-llvm.sh

      - name: Build windows release zip
        run: ./scripts/build-release.sh windows

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            dist/cryo-*-windows-x86_64.zip
            dist/cryo-*-windows-x86_64.zip.sha256

  # ---------------------------------------------------------------------------
  # Publish — verify both platforms' archives, then attach them to the GH
  # Release with a curated body (CHANGELOG section + platform matrix).
  # ---------------------------------------------------------------------------
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    permissions:
      contents: write   # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify the tag matches VERSION
        id: gate
        run: |
          VER=$(grep -oE 'const VERSION:[[:space:]]*string[[:space:]]*=[[:space:]]*"[^"]+"' \
                  compiler/src/main.cryo | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-rc*}"   # v1.0.0-rc1 -> 1.0.0; plain v1.0.0 unchanged
          echo "VERSION=$VER  tag=$TAG  base=$BASE"
          if [ "$VER" != "$BASE" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match VERSION '$VER' in compiler/src/main.cryo"
            exit 1
          fi
          if [ "$TAG" != "$BASE" ]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Never publish an archive we haven't verified: checksums must match,
      # the linux tarball must contain a runnable static cryo (this runner
      # has no LLVM installed, so `--version` succeeding also proves the
      # binary is self-contained), and the windows zip must have the
      # expected layout.
      - name: Verify artifact checksums and contents
        run: |
          cd dist
          sha256sum -c ./*.sha256

          mkdir -p /tmp/relcheck
          tar -xzf cryo-*-linux-x86_64.tar.gz -C /tmp/relcheck
          /tmp/relcheck/cryo-*/bin/cryo --version

          unzip -q -d /tmp/relcheck-win cryo-*-windows-x86_64.zip
          for f in bin/cryo.exe bin/LLVM-C.dll stdlib/lib.cryo VERSION; do
            test -e /tmp/relcheck-win/cryo-*/"$f" \
              || { echo "::error::windows zip is missing $f"; exit 1; }
          done

      # Curated body: install one-liners + platform matrix, then the
      # CHANGELOG section for this version. The auto-generated "what's
      # changed" PR list is appended after it by gh-release.
      - name: Compose the release body
        run: |
          BASE="${{ steps.gate.outputs.base }}"
          {
            cat <<EOF
          ## Install

          **Linux x86_64**
          \`\`\`bash
          curl -fsSL https://cryo-lang.org/install.sh | bash
          \`\`\`

          **Windows x86_64** (PowerShell)
          \`\`\`powershell
          irm https://cryo-lang.org/install.ps1 | iex
          \`\`\`

          Or download an archive below and verify it with \`sha256sum -c <archive>.sha256\`.

          | Platform | Artifact | Notes |
          | --- | --- | --- |
          | Linux x86_64 (any glibc distro) | \`cryo-${BASE}-linux-x86_64.tar.gz\` | Fully static binary - no LLVM or other runtime dependencies. |
          | Windows 10+ x86_64 | \`cryo-${BASE}-windows-x86_64.zip\` | \`cryo.exe\` + bundled \`LLVM-C.dll\`; linking your programs needs a mingw-w64 gcc on PATH. |

          Compiling your programs shells out to a system C compiler for the final link (\`gcc\`/\`clang\` on Linux, mingw-w64 \`gcc\` on Windows). macOS, ARM64 and musl/Alpine prebuilts are not part of v1 - build from source with \`./install.sh --dev\`.

          ## Changelog

          EOF
            awk -v ver="$BASE" '
              $0 ~ "^## \\[" ver "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
          } > /tmp/release-body.md
          echo "--- release body ---"
          cat /tmp/release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: /tmp/release-body.md
          prerelease: ${{ steps.gate.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/cryo-*-linux-x86_64.tar.gz
            dist/cryo-*-linux-x86_64.tar.gz.sha256
            dist/cryo-*-windows-x86_64.zip
            dist/cryo-*-windows-x86_64.zip.sha256
